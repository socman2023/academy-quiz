name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Engine smoke test
        run: npm run test:engine
      - name: Distribution audit
        run: npm run audit:distribution
      - name: Public asset check
        run: npm run test:assets
      - name: VK production build
        run: npm run build
      - name: GitHub Pages build
        run: npm run build:pages
